# Tandy TRS-80 Model II / WD179x FM DMK workflow.
# DMK images are handled by optional gw2dmk/dmk2gw tools; this entry
# provides a selectable format hint in HamsterWeazle.
disk dmk
    cyls = 77
    heads = 1
    tracks * ibm.fm
        secs = 26
        bps = 128
        gap3 = 26
        rate = 250
        rpm = 360
    end
end
